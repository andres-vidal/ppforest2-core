name: Run C++ Strict Warnings

# Compile the core sources the R package vendors with GCC under -Wall -Wextra
# -pedantic -Werror across multiple GCC versions. CRAN's incoming checks compile
# with stricter flags than a default `R CMD check`, so warnings (e.g. C++20
# designated initializers, -Wreorder) that clang accepts silently only surface
# on CRAN. This job catches that whole class of portability issue before
# ppforest2-r vendors a release. Third-party headers (Eigen, nlohmann/json, pcg)
# are included via -isystem so their warnings do not count.
#
# The compile itself is `make cpp-strict`, so the flags and the source list have
# one definition rather than a copy here that can drift out of step with it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  strict:
    name: GCC ${{ matrix.gcc }} -Wall -Wextra -pedantic -Werror
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: ['13', '14']
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC ${{ matrix.gcc }} and Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-${{ matrix.gcc }} libeigen3-dev
      - name: Cache CMake deps
        uses: actions/cache@v6
        with:
          path: .build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('core/Dependencies.cmake') }}
      - name: Fetch header-only dependencies
        run: make fetch-deps
      - name: Compile core sources (warnings are errors)
        run: make cpp-strict STRICT_CXX=g++-${{ matrix.gcc }}
