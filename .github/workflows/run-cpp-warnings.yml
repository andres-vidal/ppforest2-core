name: Run C++ Strict Warnings

# Compile the core sources the R package vendors with GCC under -Wall -Wextra
# -pedantic -Werror across multiple GCC versions. CRAN's incoming checks compile
# with stricter flags than a default `R CMD check`, so warnings (e.g. C++20
# designated initializers, -Wreorder) that clang accepts silently only surface
# on CRAN. This job catches that whole class of portability issue before
# ppforest2-r vendors a release. Third-party headers (Eigen, nlohmann/json, pcg)
# are included via -isystem so their warnings do not count.
#
# The R package compiles these sources against whichever Eigen RcppEigen ships,
# not the Eigen pinned for the CMake build: 3.4.0 today, 5.0 once RcppEigen's
# update lands. Each GCC version therefore compiles them against Eigen 3.4.0 and
# against the latest 5.0.x release, so code that builds with one but not the
# other fails here.
#
# The compile itself is `make cpp-strict`, so the flags and the source list have
# one definition rather than a copy here that can drift out of step with it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  strict:
    name: GCC ${{ matrix.gcc }}, Eigen ${{ matrix.eigen }} -Wall -Wextra -pedantic -Werror
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: ['13', '14']
        eigen: ['3.4.0', '5.0.x']
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC ${{ matrix.gcc }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-${{ matrix.gcc }}
      - name: Cache CMake deps
        uses: actions/cache@v6
        with:
          path: .build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('core/Dependencies.cmake') }}
      - name: Fetch header-only dependencies
        run: make fetch-deps
      - name: Fetch Eigen ${{ matrix.eigen }}
        run: |
          want='${{ matrix.eigen }}'
          prefix=$(printf '%s' "${want%.x}" | sed 's/\./\\./g')
          tag=$(git ls-remote --tags --refs https://gitlab.com/libeigen/eigen.git \
            | sed 's|.*refs/tags/||' | grep -xE "${prefix}(\.[0-9]+)?" | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "::error::No Eigen release tag matches $want"
            exit 1
          fi
          echo "Eigen $tag"
          git clone --quiet --depth 1 --branch "$tag" https://gitlab.com/libeigen/eigen.git .eigen
      - name: Compile core sources (warnings are errors)
        run: make cpp-strict STRICT_CXX=g++-${{ matrix.gcc }} STRICT_EIGEN=.eigen
